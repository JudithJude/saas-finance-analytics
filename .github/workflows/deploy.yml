# After a merge to main, ship the DAGs and dbt project to Astro.
# Needs two repository secrets: ASTRO_API_TOKEN and ASTRO_DEPLOYMENT_ID.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # Only deploy when CI passed on main.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
    steps:
      - name: Skip if Astro isn't set up yet
        if: ${{ env.ASTRO_API_TOKEN == '' }}
        run: echo "No ASTRO_API_TOKEN secret, so nothing to deploy to. Add the secrets to turn deploys on."
      - uses: actions/checkout@v5
        if: ${{ env.ASTRO_API_TOKEN != '' }}
      - name: Install the Astro CLI
        if: ${{ env.ASTRO_API_TOKEN != '' }}
        run: curl -sSL https://install.astronomer.io | sudo bash -s
      - name: Deploy
        if: ${{ env.ASTRO_API_TOKEN != '' }}
        run: astro deploy ${{ secrets.ASTRO_DEPLOYMENT_ID }} --force
