version: 2

models:
  - name: stg_app__accounts
    description: One row per account in the product.
    columns:
      - name: account_id
        data_tests: [unique, not_null]

  - name: stg_app__prompt_runs
    description: One row per account per day of tracked prompts.
    columns:
      - name: prompt_run_id
        data_tests: [unique, not_null]
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_app__accounts')
                field: account_id
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["account_id", "run_date"]
