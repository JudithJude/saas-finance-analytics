version: 2

sources:
  - name: app_db
    description: The product's own database (a read-only copy), loaded into raw by include/extract.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: accounts
        identifier: app_db_accounts
      - name: prompt_runs
        identifier: app_db_prompt_runs
