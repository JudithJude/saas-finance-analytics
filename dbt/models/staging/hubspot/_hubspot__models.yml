version: 2

models:
  - name: stg_hubspot__companies
    description: One row per HubSpot company.
    columns:
      - name: company_id
        data_tests: [unique, not_null]
      - name: company_domain
        data_tests: [unique]

  - name: stg_hubspot__deals
    description: One row per HubSpot deal.
    columns:
      - name: deal_id
        data_tests: [unique, not_null]
      - name: company_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_hubspot__companies')
                field: company_id
      - name: deal_stage
        data_tests:
          - accepted_values:
              arguments:
                values: ["appointmentscheduled", "qualifiedtobuy", "closedwon", "closedlost"]
