version: 2

sources:
  - name: hubspot
    description: CRM data, loaded untouched into raw by include/extract.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: companies
        identifier: hubspot_companies
      - name: deals
        identifier: hubspot_deals
