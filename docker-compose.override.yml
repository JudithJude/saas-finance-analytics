# Extra containers for local work.
# `astro dev start` adds these next to Airflow automatically.
# Without Airflow: docker compose -f docker-compose.override.yml up -d
services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse
    ports:
      - "5433:5432"   # 5433 on your laptop, so it doesn't clash with Airflow's own Postgres
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse"]
      interval: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    depends_on:
      - warehouse

volumes:
  warehouse_data:
